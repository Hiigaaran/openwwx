name: Release
# Builds the desktop app for Windows, macOS and Linux and attaches the archives
# to a GitHub release. Runs when a tag like v0.1.0 is pushed, or by hand from
# the Actions tab ("Run workflow"), which creates the tag on the chosen branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, for example v0.1.0"
        required: true
permissions:
  contents: write
env:
  VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: openwwx.exe, server: openwwx-server.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: openwwx, server: openwwx-server }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: openwwx, server: openwwx-server }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: openwwx, server: openwwx-server }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p openwwx -p rawdeal-net --bin openwwx --bin openwwx-server --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="openwwx-${VERSION}-${{ matrix.name }}"
          mkdir -p "$dir/cards"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$dir/"
          cp "target/${{ matrix.target }}/release/${{ matrix.server }}" "$dir/"
          cp docs/LEEME-release.txt "$dir/LEEME.txt"
          echo "Pon aquí tus sets en formato .ron (por ejemplo 01-premiere.ron)." > "$dir/cards/LEEME.txt"
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$dir.zip" "$dir" > /dev/null
          else
            tar czf "dist/$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Versión de escritorio de OpenWWX. Descarga el archivo de tu sistema, descomprímelo y abre openwwx. Las cartas no vienen incluidas; pon tus sets .ron en la carpeta cards. Incluye openwwx-server, el servidor común para listar partidas en línea."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenWWX $VERSION" --notes "$notes"
          fi
